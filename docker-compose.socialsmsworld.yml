version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: socialsms-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=sms_relay_db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialsms-backend
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=sms_relay_db
      - JWT_SECRET=${JWT_SECRET}
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - SEED_SECRET=${SEED_SECRET}
      - CORS_ORIGINS=https://socialsmsworld.com,https://www.socialsmsworld.com
      - REACT_APP_BACKEND_URL=https://socialsmsworld.com
    healthcheck:
      test: curl -f http://localhost:8001/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=https://socialsmsworld.com
    container_name: socialsms-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: socialsms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: socialsms-certbot
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongodb_data:
  uploads_data:
  letsencrypt_data:
  certbot_webroot:
